name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The build needs the guarded vulkan.cppm (module `vulkan_hpp`); newer SDKs are rejected at configure.
  VULKAN_SDK_VERSION: 1.4.328.1
  LLVM_VERSION: 22
  LLVM_WINDOWS_VERSION: 22.1.4

jobs:
  linux:
    name: Linux (${{ matrix.config }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        config: [debug, release]
    env:
      PRESET: linux-clang-${{ matrix.config }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Ubuntu 24.04's libstdc++ 14.2 declares std::forward_like with a deduced return type, which
      # clang rejects across module boundaries; libstdc++ 15 comes from the toolchain PPA.
      - name: Install Clang, libstdc++ 15, Ninja and GLFW dependencies
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          wget -q https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh "$LLVM_VERSION"
          sudo apt-get install -y "clang-tools-$LLVM_VERSION" libstdc++-15-dev ninja-build \
            libwayland-dev libxkbcommon-dev xorg-dev
          # Unversioned clang, clang++ and clang-scan-deps (module scanning) for the preset.
          echo "/usr/lib/llvm-$LLVM_VERSION/bin" >> "$GITHUB_PATH"

      - name: Cache Vulkan SDK
        id: cache-vulkan
        uses: actions/cache@v4
        with:
          path: ~/VulkanSDK
          key: vulkan-sdk-linux-${{ env.VULKAN_SDK_VERSION }}

      - name: Download Vulkan SDK
        if: steps.cache-vulkan.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/VulkanSDK
          curl -sSfL "https://sdk.lunarg.com/sdk/download/$VULKAN_SDK_VERSION/linux/vulkansdk-linux-x86_64-$VULKAN_SDK_VERSION.tar.xz" \
            | tar -xJ -C ~/VulkanSDK

      - name: Set up Vulkan SDK environment
        run: |
          sdk="$HOME/VulkanSDK/$VULKAN_SDK_VERSION/x86_64"
          echo "VULKAN_SDK=$sdk" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$sdk/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          echo "$sdk/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: |
          clang++ -v
          cmake --preset "$PRESET"

      - name: Build
        run: cmake --build --preset "$PRESET"

      # The device tests need a GPU, which hosted runners lack.
      - name: Test
        run: ctest --preset "$PRESET" -LE device

  windows:
    name: Windows (${{ matrix.config }})
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        config: [debug, release]
    env:
      PRESET: windows-clang-${{ matrix.config }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache LLVM and Vulkan SDK
        id: cache-tools
        uses: actions/cache@v4
        with:
          path: |
            C:\LLVM
            C:\VulkanSDK
          key: tools-windows-llvm-${{ env.LLVM_WINDOWS_VERSION }}-vulkan-${{ env.VULKAN_SDK_VERSION }}

      - name: Install LLVM and Vulkan SDK
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          curl.exe -sSfL -o llvm.exe "https://github.com/llvm/llvm-project/releases/download/llvmorg-$env:LLVM_WINDOWS_VERSION/LLVM-$env:LLVM_WINDOWS_VERSION-win64.exe"
          Start-Process -Wait -FilePath .\llvm.exe -ArgumentList '/S', '/D=C:\LLVM'
          curl.exe -sSfL -o vulkan.exe "https://sdk.lunarg.com/sdk/download/$env:VULKAN_SDK_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_SDK_VERSION.exe"
          Start-Process -Wait -FilePath .\vulkan.exe -ArgumentList '--root', "C:\VulkanSDK\$env:VULKAN_SDK_VERSION", '--accept-licenses', '--default-answer', '--confirm-command', 'install'
          Remove-Item llvm.exe, vulkan.exe

      - name: Set up tool environment
        run: |
          choco install ninja -y --no-progress
          "C:\LLVM\bin" >> $env:GITHUB_PATH
          "C:\VulkanSDK\$env:VULKAN_SDK_VERSION\Bin" >> $env:GITHUB_PATH
          "VULKAN_SDK=C:\VulkanSDK\$env:VULKAN_SDK_VERSION" >> $env:GITHUB_ENV

      - name: Configure
        run: |
          clang++ --version
          cmake --preset $env:PRESET

      - name: Build
        run: cmake --build --preset $env:PRESET

      # The device tests need a GPU, which hosted runners lack.
      - name: Test
        run: ctest --preset $env:PRESET -LE device
